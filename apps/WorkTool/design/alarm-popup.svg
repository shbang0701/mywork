<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" role="img" aria-labelledby="title desc">
  <title id="title">WorkTool 알람 시안 — 알람 창 · 설정 알림 · 일정 폼 알람 자세히</title>
  <desc id="desc">2026-11-22 시안. 값은 apps/WorkTool/design/README.md 7절 「알람 창」, 8절 일정 · 설정·도움말. 하늘(기본) 색. 가짜 일정 이름만 씁니다.</desc>
  <defs>
    <!-- 알람(Ringer) · 알람 꺼짐(QuietHours) · 더 보기 · 닫기 · 펼침 아이콘을 도형으로 그린다(글꼴 없이도 보이게) -->
    <g id="bell"><path d="M8 1.6c-2.4 0-4.1 1.8-4.1 4.3v2.7L2.6 11h10.8l-1.3-2.4V5.9C12.1 3.4 10.4 1.6 8 1.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.4 12.6a1.6 1.6 0 0 0 3.2 0" fill="none" stroke="currentColor" stroke-width="1.2"/></g>
    <g id="moon"><path d="M10.6 2.2a5.6 5.6 0 1 0 3.2 9.6A4.6 4.6 0 0 1 10.6 2.2z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></g>
    <g id="more"><circle cx="3" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="13" cy="8" r="1" fill="currentColor"/></g>
    <g id="close"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></g>
    <g id="down"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="right"><path d="M4.5 2.5L8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="check"><path d="M3 6.5l2.5 2.5 5-5.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <g font-family="Segoe UI, 'Malgun Gothic', sans-serif">
    <rect width="1240" height="1000" fill="#F5F7FA"/>
    <text x="24" y="34" font-size="20" fill="#1D2B3A">WorkTool 알람 시안 — 알람 창 · 설정 「알림」 · 일정 폼 「알람 자세히」</text>
    <text x="24" y="56" font-size="12" fill="#465668">값: apps/WorkTool/design/README.md 7절 「알람 창」 · 8절 일정 · 설정·도움말. 하늘(기본) 색, 배율 100%. 일정 이름은 가짜 값입니다.</text>

    <!-- ① 알람 창 -->
    <rect x="24" y="72" width="600" height="912" rx="8" fill="#FFFFFF" stroke="#DAE0E6"/>
    <text x="40" y="98" font-size="14" font-weight="600" fill="#1D2B3A">① 알람 창 — 오른쪽 아래 16 · 위로 쌓기 8 · 맨 위 · 포커스 안 뺏음</text>
    <rect x="40" y="112" width="568" height="600" fill="#E3EAF1"/>
    <text x="56" y="136" font-size="12" fill="#526172">다른 프로그램 화면(앱 창은 트레이로 숨어 있어도 뜸)</text>
    <rect x="40" y="672" width="568" height="40" fill="#2B3440"/>
    <text x="56" y="697" font-size="12" fill="#C9D3DD">작업 표시줄</text>

    <!-- 「이 일정 알람 끄기」 뒤 모습 -->
    <text x="56" y="164" font-size="12" fill="#526172">「이 일정 알람 끄기」 뒤</text>
    <g transform="translate(56 172)">
      <rect x="0.5" y="0.5" width="359" height="148" fill="#FFFFFF" stroke="#DAE0E6"/>
      <use href="#bell" x="16" y="8" color="#226EBE"/>
      <text x="40" y="21" font-size="12" fill="#465668">알람</text>
      <use href="#more" x="298" y="8" color="#465668"/>
      <use href="#close" x="330" y="8" color="#465668"/>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1D2B3A">주간 회의</text>
      <text x="16" y="79" font-size="14" fill="#465668">이 일정 알람을 껐습니다.</text>
      <rect x="196" y="100" width="56" height="32" rx="4" fill="#226EBE"/>
      <text x="224" y="121" font-size="14" fill="#FFFFFF" text-anchor="middle">확인</text>
      <rect x="260.5" y="100.5" width="83" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="302" y="121" font-size="14" fill="#1D2B3A" text-anchor="middle">실행 취소</text>
    </g>

    <!-- 쌓인 알람 창 둘: 위(하루 종일 · 더 보기 메뉴 열림), 아래(시각 일정) -->
    <g transform="translate(232 350)">
      <rect x="0.5" y="0.5" width="359" height="148" fill="#FFFFFF" stroke="#DAE0E6"/>
      <use href="#bell" x="16" y="8" color="#226EBE"/>
      <text x="40" y="21" font-size="12" fill="#465668">알람</text>
      <rect x="292" y="2" width="28" height="28" rx="4" fill="#F3F8FD"/>
      <use href="#more" x="298" y="8" color="#465668"/>
      <use href="#close" x="330" y="8" color="#465668"/>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1D2B3A">SRV-01 펌웨어 업데이트 · 서비스 점…</text>
      <text x="16" y="79" font-size="14" fill="#465668">하루 종일</text>
      <rect x="216" y="100" width="56" height="32" rx="4" fill="#226EBE"/>
      <text x="244" y="121" font-size="14" fill="#FFFFFF" text-anchor="middle">확인</text>
      <rect x="280.5" y="100.5" width="63" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="312" y="121" font-size="14" fill="#1D2B3A" text-anchor="middle">5분 뒤</text>
    </g>
    <g transform="translate(232 507)">
      <rect x="0.5" y="0.5" width="359" height="148" fill="#FFFFFF" stroke="#DAE0E6"/>
      <use href="#bell" x="16" y="8" color="#226EBE"/>
      <text x="40" y="21" font-size="12" fill="#465668">알람</text>
      <use href="#more" x="298" y="8" color="#465668"/>
      <use href="#close" x="330" y="8" color="#465668"/>
      <rect x="8" y="32" width="344" height="56" rx="4" fill="#F3F8FD"/>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1D2B3A">주간 회의</text>
      <text x="16" y="79" font-size="14" fill="#465668">14:00 · 10분 뒤</text>
      <text x="350" y="46" font-size="11" fill="#526172" text-anchor="end">올리면 Surface 조작색 · 누르면 그날 폼</text>
      <rect x="216" y="100" width="56" height="32" rx="4" fill="#226EBE"/>
      <text x="244" y="121" font-size="14" fill="#FFFFFF" text-anchor="middle">확인</text>
      <rect x="280.5" y="100.5" width="63" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="312" y="121" font-size="14" fill="#1D2B3A" text-anchor="middle">5분 뒤</text>
    </g>
    <!-- 더 보기 메뉴(7절 메뉴) + 하위 메뉴 -->
    <g transform="translate(372 382)">
      <rect x="0.5" y="0.5" width="179" height="80" rx="8" fill="#FFFFFF" stroke="#DAE0E6"/>
      <rect x="4" y="4" width="172" height="32" rx="4" fill="#F3F8FD"/>
      <text x="16" y="25" font-size="14" fill="#1D2B3A">이 일정 알람 끄기</text>
      <rect x="8" y="40" width="164" height="1" fill="#E6EDF4"/>
      <text x="16" y="66" font-size="14" fill="#1D2B3A">알람 잠시 끄기</text>
      <use href="#right" x="156" y="54" color="#465668"/>
    </g>
    <g transform="translate(248 418)">
      <rect x="0.5" y="0.5" width="119" height="72" rx="8" fill="#FFFFFF" stroke="#DAE0E6"/>
      <text x="16" y="25" font-size="14" fill="#1D2B3A">1시간</text>
      <text x="16" y="57" font-size="14" fill="#1D2B3A">오늘 하루</text>
    </g>
    <!-- 간격 표시: 오른쪽 16 · 아래 16 · 창 사이 8 -->
    <g stroke="#C42F29" stroke-width="1" fill="none">
      <path d="M592 600h16M592 596v8M608 596v8"/>
      <path d="M220 656v16M216 656h8M216 672h8"/>
      <path d="M220 499v8M216 499h8M216 507h8"/>
