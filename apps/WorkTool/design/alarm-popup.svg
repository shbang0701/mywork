    <g font-size="10" fill="#B42820">
      <text x="594" y="592">16</text>
      <text x="204" y="668">16</text>
      <text x="208" y="506">8</text>
    </g>

    <!-- 상태 줄 · 트레이 메뉴 -->
    <text x="40" y="744" font-size="14" font-weight="600" fill="#1D2B3A">알람 잠시 끄기 — 상태 줄 · 트레이 메뉴 · 설정 · 알람 창 어디서든</text>
    <rect x="40" y="756" width="568" height="24" fill="#EFF6FD"/>
    <use href="#moon" x="380" y="760" color="#526172"/>
    <text x="398" y="773" font-size="12" fill="#465668">알람 꺼짐 ~ 15:30</text>
    <use href="#check" x="518" y="762" color="#526172"/>
    <text x="534" y="773" font-size="12" fill="#465668">남은 일 3</text>
    <text x="40" y="798" font-size="11" fill="#526172">상태 줄 오른쪽 맨 앞. 누르면 바로 다시 켭니다(툴팁 「누르면 알람을 다시 켭니다.」).</text>
    <g transform="translate(40 812)">
      <rect x="0.5" y="0.5" width="219" height="118" fill="#FFFFFF" stroke="#C9CED6"/>
      <text x="28" y="24" font-size="13" fill="#1D2B3A">열기</text>
      <rect x="3" y="33" width="214" height="26" fill="#E5F1FB"/>
      <text x="28" y="51" font-size="13" fill="#1D2B3A">알람 잠시 끄기</text>
      <use href="#right" x="200" y="40" color="#465668"/>
      <rect x="8" y="66" width="204" height="1" fill="#D7DBE0"/>
      <text x="28" y="90" font-size="13" fill="#1D2B3A">종료</text>
      <text x="0" y="146" font-size="11" fill="#526172">트레이 우클릭(Windows 기본 메뉴): 1시간 · 오늘 하루 · 다시 켤 때까지</text>
    </g>
    <g transform="translate(300 812)">
      <rect x="0.5" y="0.5" width="279" height="92" fill="#FFFFFF" stroke="#C9CED6"/>
      <text x="28" y="24" font-size="13" fill="#1D2B3A">열기</text>
      <text x="28" y="51" font-size="13" fill="#1D2B3A">알람 다시 켜기 (꺼짐 ~ 15:30)</text>
      <rect x="8" y="62" width="264" height="1" fill="#D7DBE0"/>
      <text x="28" y="84" font-size="13" fill="#1D2B3A">종료</text>
      <text x="0" y="120" font-size="11" fill="#526172">끈 동안 트레이 메뉴</text>
    </g>

    <!-- ② 설정 → 일반 → 알림 -->
