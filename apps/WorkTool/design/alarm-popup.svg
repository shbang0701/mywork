    <text x="664" y="98" font-size="14" font-weight="600" fill="#1D2B3A">② 설정 → 일반 → 알림 (화면 설정 행 아래 24)</text>
    <rect x="664" y="112" width="536" height="400" rx="8" fill="#FFFFFF"/>
    <text x="684" y="142" font-size="14" font-weight="600" fill="#1D2B3A">알림</text>
    <g font-size="14">
      <text x="684" y="173" fill="#465668">새 일정 기본 알람</text>
      <rect x="830.5" y="152.5" width="159" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="840" y="173" fill="#1D2B3A">10분 전</text><use href="#down" x="970" y="162" color="#465668"/>

      <text x="684" y="217" fill="#465668">하루 종일 알람 기준</text>
      <rect x="830.5" y="196.5" width="159" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="840" y="217" fill="#1D2B3A">업무 시작 시각</text><use href="#down" x="970" y="206" color="#465668"/>
      <rect x="998.5" y="196.5" width="119" height="31" rx="4" fill="#EFF6FD" stroke="#E6EDF4"/>
      <text x="1008" y="217" fill="#A3AAB4" font-family="Consolas, monospace">09:00</text>

      <text x="684" y="261" fill="#465668">늦게 켰을 때</text>
      <rect x="830.5" y="240.5" width="239" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="840" y="261" fill="#1D2B3A">시작 뒤 30분까지 울림</text><use href="#down" x="1050" y="250" color="#465668"/>

      <text x="684" y="305" fill="#465668">다시 알림</text>
      <rect x="830.5" y="284.5" width="159" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="840" y="305" fill="#1D2B3A">5분 뒤</text><use href="#down" x="970" y="294" color="#465668"/>

      <text x="684" y="349" fill="#465668">알람 소리</text>
      <rect x="830" y="336" width="16" height="16" rx="2" fill="#226EBE"/><use href="#check" x="832" y="338" color="#FFFFFF"/>
      <text x="856" y="349" fill="#1D2B3A">켜기</text>

      <text x="684" y="393" fill="#465668">소리</text>
      <rect x="830.5" y="372.5" width="239" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="840" y="393" fill="#1D2B3A">Windows Notify Calendar</text><use href="#down" x="1050" y="382" color="#465668"/>

      <text x="684" y="437" fill="#465668">볼륨</text>
      <rect x="830" y="430" width="168" height="4" rx="2" fill="#226EBE"/>
      <rect x="998" y="430" width="72" height="4" rx="2" fill="#74808F"/>
      <circle cx="998" cy="432" r="9.5" fill="#FFFFFF" stroke="#74808F"/><circle cx="998" cy="432" r="6" fill="#226EBE"/>
      <text x="1082" y="437" font-weight="600" fill="#1D2B3A">70%</text>
      <rect x="1124.5" y="416.5" width="75" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="1162" y="437" fill="#1D2B3A" text-anchor="middle">들어 보기</text>

      <text x="684" y="481" fill="#465668">알람 잠시 끄기</text>
      <rect x="830.5" y="460.5" width="63" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="862" y="481" fill="#1D2B3A" text-anchor="middle">1시간</text>
      <rect x="901.5" y="460.5" width="79" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="941" y="481" fill="#1D2B3A" text-anchor="middle">오늘 하루</text>
      <rect x="988.5" y="460.5" width="111" height="31" rx="4" fill="#FFFFFF" stroke="#CCD2D8"/>
      <text x="1044" y="481" fill="#1D2B3A" text-anchor="middle">다시 켤 때까지</text>
    </g>
    <text x="664" y="522" font-size="11" fill="#526172">앞 세 줄은 일정 탭이 등록(탭을 끄면 빠짐). 소리를 끄면 아래 칸은 비활성 + 이유 툴팁.</text>

    <!-- ③ 일정 폼 — 알람 자세히 -->
    <rect x="648" y="544" width="568" height="440" rx="8" fill="#FFFFFF" stroke="#DAE0E6"/>
    <text x="664" y="570" font-size="14" font-weight="600" fill="#1D2B3A">③ 일정 폼 — 알람 자세히 (펼침 · 하루 종일 일정)</text>
    <g font-size="14">
      <text x="680" y="604" fill="#465668">알람</text>
      <rect x="680.5" y="612.5" width="255" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="690" y="633" fill="#1D2B3A">10분 전</text><use href="#down" x="916" y="622" color="#465668"/>
      <rect x="680" y="648" width="256" height="28" rx="4" fill="#F3F8FD"/>
      <use href="#down" x="684" y="656" color="#465668"/>
      <text x="698" y="666" font-size="12" fill="#465668">알람 자세히</text>

      <text x="680" y="698" fill="#465668">소리</text>
      <rect x="680.5" y="706.5" width="255" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="690" y="727" fill="#1D2B3A">끔</text><use href="#down" x="916" y="716" color="#465668"/>
      <text x="680" y="770" fill="#465668">다시 알림</text>
      <rect x="680.5" y="778.5" width="255" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="690" y="799" fill="#1D2B3A">10분</text><use href="#down" x="916" y="788" color="#465668"/>
      <text x="680" y="842" fill="#465668">늦게 켰을 때</text>
      <rect x="680.5" y="850.5" width="255" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
