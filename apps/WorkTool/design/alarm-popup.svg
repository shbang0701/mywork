      <text x="680" y="914" fill="#465668">기준 시각</text>
      <rect x="680.5" y="922.5" width="119" height="31" rx="4" fill="#FFFFFF" stroke="#74808F"/>
      <text x="690" y="943" fill="#526172">전역 따름</text>
    </g>
    <g transform="translate(968 600)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#1D2B3A">접힌 줄(덮어쓴 값 요약)</text>
      <use href="#right" x="4" y="14" color="#465668"/>
      <text x="18" y="24" font-size="12" fill="#465668">알람 자세히</text>
      <text x="86" y="24" font-size="12" fill="#526172">· 소리 끔 · 다시 알림…</text>
      <text x="0" y="42" font-size="11" fill="#526172">(폭이 모자라면 요약 끝을 말줄임)</text>
      <text x="0" y="64" font-size="12" font-weight="600" fill="#1D2B3A">알람이 없음이면 비활성</text>
      <use href="#right" x="4" y="78" color="#A3AAB4"/>
      <text x="18" y="88" font-size="12" fill="#A3AAB4">알람 자세히</text>
      <rect x="0.5" y="98.5" width="227" height="25" rx="4" fill="#FFFFFF" stroke="#DAE0E6"/>
      <text x="8" y="115" font-size="12" fill="#1D2B3A">알람을 고르면 바꿀 수 있습니다.</text>
      <text x="0" y="160" font-size="12" font-weight="600" fill="#1D2B3A">우선순위</text>
      <text x="0" y="180" font-size="12" fill="#465668">회차(이 회차만) → 일정 → 전역</text>
      <text x="0" y="198" font-size="12" fill="#465668">「전역 따름 (값)」의 괄호는 지금 설정</text>
      <text x="0" y="216" font-size="12" fill="#465668">기준 시각은 하루 종일 일정만 보임</text>
      <text x="0" y="234" font-size="12" fill="#465668">폼을 열 때마다 접힘</text>
    </g>
